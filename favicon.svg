<!-- Small-size variant of the one-stroke mark, for 16x16 browser tabs.
     Same path and same stroke order, but pulled in off the edges and
     thickened 7 -> 12 so it does not vanish when downscaled. The diagonal
     bar stops short of the left leg; at 16px a 12-unit stroke meeting
     another one closes the gap and the counter fills in. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="Ariyah">
  <rect width="100" height="100" rx="22" fill="#0b0b0b"/>
  <path d="M29 77 L50 29 L71 77 L40 62"
        fill="none" stroke="#e7e8eb" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
